spring.application.name=${APP_NAME:universal-auth-api}
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${APP_PROFILE:postgres}
server.port=${SERVER_PORT:7000}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:${JWT_EXPIRATION:900000}}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:2592000000}
jwt.expiration=${JWT_EXPIRATION:${JWT_ACCESS_TOKEN_EXPIRATION:900000}}

# Security Configuration
security.public-paths=${SECURITY_PUBLIC_PATHS:/api/auth/register,/api/auth/login,/api/auth/refresh-token,/api/auth/logout,/api/auth/forgot-password,/api/auth/reset-password}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Auth Configuration
auth.registration.default-role=${AUTH_DEFAULT_ROLE:CUSTOMER}
auth.registration.allowed-roles=${AUTH_ALLOWED_ROLES:CUSTOMER,STAFF,OWNER}

# Email Configuration (SMTP Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
